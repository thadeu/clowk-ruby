name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -e 'require_relative "lib/clowk/version"; print Clowk::VERSION')"
          if [ "$tag" != "$gem_version" ]; then
            echo "Tag '$tag' does not match gem version '$gem_version'" >&2
            exit 1
          fi

      - name: Run tests
        run: bundle exec rspec

      - name: Build and publish to RubyGems
        run: |
          gem build clowk.gemspec
          gem push clowk-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
